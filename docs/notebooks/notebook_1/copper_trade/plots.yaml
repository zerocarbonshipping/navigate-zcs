# The plots Session 1 draws with Lantern, which reads this catalogue when it is
# started in this folder. The entries follow Lantern's own plots.yaml.

# the runs the notebook writes, and the Horizon study of levers.hor
customize_runs:
  example_4:     {name: reference, color: black_4}
  your_scenario: {name: your scenario, color: blue_8}
  levers:        {name: all levers drawn, color: blue_8}

session:
  emissions:
    title: Well-to-wake emissions
    total: true
    series: global.total_equivalent_wtw

  fuel_consumed:
    title: Fuel consumed
    draw: stack
    label: shore_power
    series:
      - global.consumed_energy
      - global.shore_power_energy

  # per transport work: the fleet's cargo-miles are tonne-nautical-miles, and the
  # scale turns USD per tonne-nautical-mile into USD per 1,000 tonne-km (1,000 / 1.852)
  expenses:
    title: What the ships paid per tonne-km
    unit: USD per 1,000 t-km
    draw: stack
    split_by: attribute
    per: fleet.cargo_miles
    scale: 539.96
    series:
      - fleet.vessel_expenses
      - fleet.fuel_conversion_expenses
      - fleet.technology_expenses
      - fleet.total_fuel_expenses
      - fleet.levy_expenses
      - fleet.regulation_expenses

  # on a Horizon study's summary runs this is, say, the median expenses over the
  # median cargo-miles, not the median of their ratio
  expenses_total:
    title: What the ships paid in total, per tonne-km
    unit: USD per 1,000 t-km
    total: true
    per: fleet.cargo_miles
    scale: 539.96
    series: fleet.expenses
