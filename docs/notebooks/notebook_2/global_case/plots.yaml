# The plots Session 2 draws with Lantern, which reads this catalogue when it is
# started in this folder. The entries follow Lantern's own plots.yaml.

# the runs the notebook writes: STEP 3's reference scenarios take the colours of
# Lantern's own catalogue; STEP 4's scenarios show under their own names
customize_runs:
  basecase_no_regulation:     {name: no regulation, color: yellow_5}
  basecase_mid_regulation:    {name: mid regulation, color: blue_5}
  basecase_strong_regulation: {name: strong regulation, color: green_5}
  business_as_usual:          {name: business as usual, color: black_5}
  your_scenario:              {name: your scenario, color: blue_8}
  levers:                     {name: study, color: blue_8}

session:
  emissions:
    title: Well-to-wake emissions
    total: true
    series: global.total_equivalent_wtw

  # a panel per regulation: its limit, dashed, and the intensity the ships it
  # polices reached; STEP 3 draws the global fuel standard's, gfs in the deck
  intensity_limit:
    title: Intensity limit
    unit: gCO2eq/MJ
    panels: node
    layers:
      - series: regulation.shared_threshold
        label: limit
        line: dash
      - series: regulation.shared_compliance
        label: ships

  fuel_consumed:
    title: Fuel consumed
    draw: stack
    label: shore_power
    series:
      - global.consumed_energy
      - global.shore_power_energy

  # per transport work: the fleets' cargo-miles are tonne-nautical-miles, and the
  # scale turns USD per tonne-nautical-mile into USD per 1,000 tonne-km (1,000 / 1.852)
  expenses:
    title: What the ships paid per tonne-km
    unit: USD per 1,000 t-km
    draw: stack
    split_by: attribute
    per: fleet.cargo_miles
    scale: 539.96
    series:
      - fleet.vessel_expenses
      - fleet.fuel_conversion_expenses
      - fleet.technology_expenses
      - fleet.total_fuel_expenses
      - fleet.levy_expenses
      - fleet.regulation_expenses

  expenses_total:
    title: What the ships paid in total, per tonne-km
    unit: USD per 1,000 t-km
    total: true
    per: fleet.cargo_miles
    scale: 539.96
    series: fleet.expenses
