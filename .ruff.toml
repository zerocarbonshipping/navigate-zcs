#
# This repository's ruff configuration: lint rule selection, docstring and
# import conventions, per-file waivers, and the legacy-file ratchet.

line-length = 88
target-version = "py313"

[format]
docstring-code-format = true

[lint]
# preview rules are opt-in one at a time, by full code, in extend-select below
preview = true
explicit-preview-rules = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
    "TC",  # flake8-type-checking
    "SLF", # flake8-self
    "NPY", # numpy-specific checks (deprecated aliases, legacy random API)
    "ICN", # canonical import aliases (numpy as np, pandas as pd, ...)
    "PGH", # bans blanket noqa/type-ignore; malformed mock assertions
    "PT",  # pytest style and failure quality
]
extend-select = [
    "D213",   # multi-line docstring summaries start on the second line
    "D417",   # every argument appears in a Parameters section that exists
    "DOC102", # every documented parameter exists in the signature
    "DOC202", # no Returns section on a function that returns nothing
    "ERA001", # no commented-out code
    "G001",   # no str.format in logging calls - pass lazy % arguments
    "G004",   # no f-strings in logging calls - pass lazy % arguments
]
ignore = [
    "E731", # lambda assignments are allowed
    "D105", # magic methods need no docstring
]

[lint.pydocstyle]
convention = "numpy"

[lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["helpers"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
# external solver APIs dictate the naming in the shims
"navigate/bunker/solver.py" = ["N802"]
# the shim's classes share one another's state, as gurobipy's do
"navigate/bunker/solver_highs.py" = ["N802", "SLF001"]
"tests/unit/test_bunker_build.py" = ["N802"]
# expectation, profile, and node lifecycle methods carry no docstrings; the
# DSL setters on nodes do (see CODESTYLE.md, Navigate-specific conventions)
"navigate/core/expectations/*" = ["D102"]
"navigate/core/profiles/*" = ["D102"]
"navigate/core/nodes/*" = ["D102"]
"navigate/core/general_nodes/*" = ["D102"]
# tests document themselves through their names and access private state of
# the module under test (white-box testing is the suite convention)
"tests/*" = ["D1", "SLF001"]

