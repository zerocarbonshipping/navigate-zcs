[build-system]
requires = ["setuptools>=68.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navigate-zcs"
version = "1.0.0"
authors = [
    { name = "Frederik Winkel Lehn", email = "frederik.lehn@zerocarbonshipping.com" },
]
maintainers = [
    { name = "Mathias Hintze", email = "mathias.hintze@zerocarbonshipping.com"},
    { name = "Julius Thomas", email = "julius.thomas@zerocarbonshipping.com" }
]
description = "A sectoral integrated assessment model for simulating transitions of the maritime industry"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "highspy",
    "pandas",
    "numpy",
    "matplotlib",
    "scipy",
    "tabulate",
    "openpyxl",
    "lark"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "flake8-bugbear",
    "pep8-naming",
    "isort",
]
gurobi = [
    "gurobipy",
]

[project.urls]
Homepage = "https://www.zerocarbonshipping.com/"
Repository = "https://github.com/zerocarbonshipping/navigate-zcs"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["assumptions*", "simulations*", "tutorials*", "tests*", "syntax*", "docs*",
    "build*", "dist*", "*.egg-info*", "bdist*"]

[tool.setuptools.package-data]
"navigate" = ["preamble.txt"]
"navigate.parser" = ["grammar.lark"]

[project.scripts]
navigate = "navigate.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# only the test tree, never the repo root: root would shadow the installed
# wheel with the source checkout in CI's wheel-validation job
pythonpath = ["tests"]
addopts = "-x --tb=short -q --import-mode=importlib"
markers = [
    "slow: marks tests as slow (> 30s)",
    "integration: marks large integration tests (> 5 min)",
]

[tool.isort]
profile = "black"
line_length = 120
# helpers lives at tests/helpers, one level below the repo root, so isort's
# first-party auto-detection cannot see it
known_first_party = ["helpers"]