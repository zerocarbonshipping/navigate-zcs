# Does the workshop still run on the latest main?
#
# Merges origin/main into the workshop branch, then runs every deck the
# workshop and the docs rely on and executes the workshop notebooks. On a
# failure it opens (or comments on) one GitHub issue. The job summary also lists
# what changed on main since the workshop's base in the places that change
# results without breaking anything: the parser, the profiles, the assumptions.
#
# Trial home: dev-workshop. Once it has proved itself it moves to main, with
# `on: push: branches: [main]` and a weekly `schedule`, checking out
# dev-workshop explicitly (`ref: dev-workshop`) - only this file goes to main.

name: Workshop check

on:
  push:
    branches: [dev-workshop, 'workshop-sync/**']
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run Session 4 (three global scenarios, about 25 minutes)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: workshop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      ASSUMPTIONS_DATA_DIR: ${{ github.workspace }}/assumptions
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge the latest main
        id: merge
        run: |
          git config user.name "workshop-check"
          git config user.email "workshop-check@users.noreply.github.com"
          git fetch origin main
          echo "base=$(git merge-base HEAD origin/main)" >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit origin/main; then
            echo "::error::origin/main does not merge cleanly into the workshop: needs a manual sync"
            exit 1
          fi

      - name: What changed on main since the workshop's base
        run: |
          {
            echo "## Changes on main since the workshop base"
            echo
            echo "Commits on main that touch the deck language, the profiles or the assumptions"
            echo "(these change results or syntax even when nothing below fails):"
            echo
            echo '```'
            git log --oneline "${{ steps.merge.outputs.base }}..origin/main" -- \
              navigate/parser 'navigate/**/profiles' navigate/core/profiles \
              assumptions/modules assumptions/defaults || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install Navigate and the notebook runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install . nbclient nbformat ipykernel
          python -m ipykernel install --user --name python3

      - name: Run the decks
        run: |
          status=0
          for deck in \
            simulations/examples/example_1/example_1.nav \
            simulations/examples/example_2/example_2.nav \
            simulations/examples/example_3/example_3.nav \
            simulations/examples/example_4/example_4.nav \
            tutorials/tutorial_1/example_solution/tutorial_1.nav \
            tutorials/tutorial_2/example_solution/tutorial_2.nav \
            tutorials/tutorial_3/example_solution/tutorial_3_scenarios/baseline/baseline.nav \
            tutorials/tutorial_3/example_solution/tutorial_3_scenarios/scenario_100/scenario_100.nav \
            tutorials/tutorial_3/example_solution/tutorial_3_scenarios/scenario_170/scenario_170.nav \
            simulations/scenarios/workshop_whatif/*.nav
          do
            log="${deck%.nav}.log"
            if ! python -m navigate "$deck" -d ./assumptions -s > /dev/null 2>&1; then
              echo "::error file=$deck::run failed"; tail -20 "$log" || true; status=1; continue
            fi
            errors=$(grep -E '^\|\s+ERROR\s+\|' "$log" | grep -oE '[0-9]+' | tail -1)
            if [ "${errors:-0}" != "0" ]; then
              echo "::error file=$deck::$errors error(s) in the log"
              grep '\[ERROR\]' "$log" | sort -u | head -10; status=1
            fi
            echo "$deck: ok (errors: ${errors:-0})"
          done
          exit $status

      - name: Execute the workshop notebooks
        run: |
          notebooks="01-run-a-simple-case 02-understand-navigate 03-run-a-global-case"
          if [ "${{ inputs.full }}" = "true" ]; then
            notebooks="$notebooks 04-run-our-reference-scenarios"
          fi
          python - $notebooks <<'PY'
          import sys, nbformat
          from nbclient import NotebookClient
          from nbclient.exceptions import CellExecutionError
          failed = []
          for name in sys.argv[1:]:
              path = f"docs/workshop/{name}.ipynb"
              nb = nbformat.read(path, as_version=4)
              try:
                  NotebookClient(nb, kernel_name="python3", timeout=3600,
                                 resources={"metadata": {"path": "docs/workshop"}}).execute()
                  print(f"{name}: ok")
              except CellExecutionError as e:
                  print(f"::error file={path}::{str(e).strip().splitlines()[-1][:300]}")
                  failed.append(name)
          sys.exit(1 if failed else 0)
          PY

      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Workshop check fails against main"
          body="The workshop check failed on \`${GITHUB_REF_NAME}\` after merging origin/main: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
