name: Publish to PyPI

# a GitHub release publishes CI's build of its tag to PyPI, once CI passes on it, finds that
# the tag names the package's version, and a member of navigate-maintainers approves
on:
  release:
    types: [published]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: ci
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
