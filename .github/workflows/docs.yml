name: Documentation

on:
  push:
    branches: [ main, dev ]   # main: build + deploy (latest); dev: build + deploy (staging)
    tags:     [ 'v*', 'V*', '[0-9]*.[0-9]*.[0-9]*' ]   # build + deploy
  pull_request:
    types: [ opened, synchronize, reopened, edited ]   # build every PR (any base), never deploy
  workflow_dispatch:

permissions:
  contents: read

# A title or body edit re-runs the checks, so the latest result on a PR is never a skip.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      # the site shows each notebook's saved outputs and never runs it
      - name: Check the notebooks hold one clean run
        run: python docs/check_notebooks.py

      - name: Build documentation
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/_build/html
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to the gh-pages branch
    # deploy on any tag and on pushes to main (publishes "latest"), and on
    # pushes to dev (publishes /staging/); never on PRs
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == 'main' || github.ref_name == 'dev')
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # publish to root (/) -> this becomes "Latest" and serves the switcher.json.
      # The root holds the latest site and nothing older. A top-level folder this
      # build does not make, but for Sphinx's own _ folders, belongs to another
      # deploy (/staging/, the /<tag>/ archives, previews such as
      # /workshop-preview/) and stays; everything else gives way to the build, so
      # pages a release removed are dropped. The push fast-forwards the branch as
      # fetched, so a deploy landing in between makes this one start over on it
      # rather than be overwritten.
      - name: Check out the published site
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published

      - name: Deploy docs (-> /)
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch -q --depth 1 origin gh-pages
            git reset -q --hard FETCH_HEAD
            git clean -q -fdx

            for entry in *; do
              if [ -d "$entry" ] && [ ! -e "../site/$entry" ] && [ "${entry#_}" = "$entry" ]; then
                continue
              fi
              git rm -r -q "$entry"
            done

            cp -r ../site/. .
            git add -A
            if git diff --cached --quiet; then
              exit 0   # the root already holds this build
            fi
            git commit -q -m "deploy: $GITHUB_SHA"

            if git push -q origin HEAD:gh-pages; then
              exit 0
            fi
            echo "gh-pages moved during deploy attempt $attempt; starting over"
          done
          exit 1

      # for tags, also keep an archived copy at /<tag>/
      - name: Deploy docs (-> /<tag>/)
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: ${{ github.ref_name }}
          keep_files: true

      # dev publishes to /staging/ for visual inspection before merging to main;
      # keep_files off so the cleanup (scoped to destination_dir) drops stale pages
      - name: Deploy docs (-> /staging/)
        if: github.ref_name == 'dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: staging
          keep_files: false

  # Pages serves the gh-pages branch that deploy assembles, but deploys it from
  # here rather than from the branch, where a stalled deploy has no timeout and
  # the next one queues behind it. Pages tends to stall on the first deployment
  # of changed content and to deploy the same content in seconds when asked
  # again, so the job asks up to three times. It waits before asking again,
  # longer the second time: the artifact listing that deploy-pages reads can lag
  # the upload, and an attempt that does not find the artifact fails at once.
  pages:
    needs: deploy   # skipped whenever deploy is, so never on PRs
    runs-on: ubuntu-latest
    permissions:
      pages: write      # create the Pages deployment
      id-token: write   # authenticate it
    environment:
      name: github-pages
      url: ${{ steps.third.outputs.page_url || steps.second.outputs.page_url || steps.first.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    env:
      # named per attempt: a re-run of this job alone would otherwise find the
      # earlier attempt's artifact under the same name and refuse to deploy
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout the assembled site
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: .

      # timeouts in ms; a healthy deploy takes under 20 seconds, and a timeout
      # cancels the deployment before the next step requests it again
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
          timeout: 90000

      - name: Wait before deploying again
        if: steps.first.outcome == 'failure'
        run: sleep 15

      - name: Deploy again
        id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
          timeout: 90000

      - name: Wait longer before deploying a last time
        if: steps.second.outcome == 'failure'
        run: sleep 60

      - name: Deploy a last time
        id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
          timeout: 300000
