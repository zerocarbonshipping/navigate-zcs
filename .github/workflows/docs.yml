name: Documentation

on:
  push:
    branches: [ main, dev ]   # main: build + deploy (latest); dev: build + deploy (staging)
    tags:     [ 'v*', 'V*', '[0-9]*.[0-9]*.[0-9]*' ]   # build + deploy
  pull_request:
    branches: [ main, dev ]   # build only, so a PR can't break the deployed site
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build documentation
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/_build/html
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to the gh-pages branch
    # deploy on any tag and on pushes to main (publishes "latest"), and on
    # pushes to dev (publishes /staging/); never on PRs
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == 'main' || github.ref_name == 'dev')
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # publish to root (/) -> this becomes "Latest" and serves the switcher.json
      # keep_files so /<tag>/ archives and /staging/ survive
      - name: Deploy docs (-> /)
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: true

      # for tags, also keep an archived copy at /<tag>/
      - name: Deploy docs (-> /<tag>/)
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: ${{ github.ref_name }}
          keep_files: true

      # dev publishes to /staging/ for visual inspection before merging to main;
      # keep_files off so the cleanup (scoped to destination_dir) drops stale pages
      - name: Deploy docs (-> /staging/)
        if: github.ref_name == 'dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: staging
          keep_files: false
