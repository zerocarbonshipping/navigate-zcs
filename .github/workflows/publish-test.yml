name: Publish to TestPyPI

# a pushed v* tag publishes CI's build of the tagged commit to TestPyPI, once CI passes on it
# and finds that the tag names the package's version
on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: ci
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
