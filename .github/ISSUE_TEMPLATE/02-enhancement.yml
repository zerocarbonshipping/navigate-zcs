name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The problem or need — what cannot be done today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: How it could work; alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: If known, where in the code or model it would live.
