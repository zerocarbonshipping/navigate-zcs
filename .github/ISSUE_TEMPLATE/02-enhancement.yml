name: Feature request
description: Ask for a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What cannot be done today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Intended behavior
      description: >
        What a deck author should be able to do or a reader of the output to
        see, from the user's side, not as an implementation.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: If known, the part of the code or model concerned.
  - type: textarea
    id: considerations
    attributes:
      label: Considerations
      description: >
        Constraints, related code, pitfalls, things ruled out, known options.
        Not a proposed fix.
