name: Documentation
description: Wrong, unclear, or missing documentation
labels: ["documentation"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, unclear, or missing.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: The manual page, docstring, or file concerned.
    validations:
      required: true
