name: Performance
description: Speed or memory, not results
labels: ["performance"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is slow or memory-heavy, and in which scenario.
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurement
      description: >
        The deck, solver, commit and machine; then wall time with the number
        of runs, a trimmed profile, or peak memory. Or the asymptotic
        argument. Prefer a small deck: the reference scenarios in
        `simulations/scenarios/` take about 25 minutes.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target
      description: If known, the speed or memory a deck author would need.
  - type: textarea
    id: location
    attributes:
      label: Location
      description: "If known: `path/to/file.py:LINE` and symbol names."
  - type: textarea
    id: considerations
    attributes:
      label: Considerations
      description: >
        Constraints, pitfalls, things ruled out, known options without a
        recommendation. Not a proposed fix.
