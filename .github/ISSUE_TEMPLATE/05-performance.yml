name: Performance
description: Runtime or memory problems
labels: ["performance"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is slow or memory-heavy, and in which scenario.
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurement
      description: Timing, profile, or memory numbers — or the asymptotic argument.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target
      description: If known, the speed or memory a deck author would need.
  - type: textarea
    id: location
    attributes:
      label: Location
      description: "If known: `path/to/file.py:LINE` and symbol names."
  - type: textarea
    id: considerations
    attributes:
      label: Considerations
      description: >
        Constraints, related code, pitfalls, things ruled out, known options.
        Not a proposed fix.
