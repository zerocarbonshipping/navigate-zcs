name: Maintenance
description: Refactoring, tests, typing, or tooling debt
labels: ["maintenance"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: The debt and what it costs.
    validations:
      required: true
  - type: textarea
    id: intended-state
    attributes:
      label: Intended state
      description: >
        The property the code should have once this is dealt with, such as
        "no package imports a layer above it". Not the steps or the
        mechanism.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: "`path/to/file.py:LINE` and symbol names."
  - type: textarea
    id: considerations
    attributes:
      label: Considerations
      description: >
        Anything a fixer should keep in mind: constraints, related code,
        pitfalls, things already ruled out, options already known. Not a
        proposed fix.
