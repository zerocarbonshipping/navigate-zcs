name: Maintenance
description: Refactoring, tests, typing, or tooling debt
labels: ["maintenance"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: The debt and what it costs.
    validations:
      required: true
  - type: textarea
    id: intended-state
    attributes:
      label: Intended state
      description: >
        The property the code should have, such as "no package imports a
        layer above it". Not the steps.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: "`path/to/file.py:LINE` and symbol names."
  - type: textarea
    id: considerations
    attributes:
      label: Considerations
      description: >
        Constraints, related code, pitfalls, things ruled out, known options.
        Not a proposed fix.
