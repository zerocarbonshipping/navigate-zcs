[mypy]
python_version = 3.13
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
warn_return_any = True

# untyped third-party solver interfaces
[mypy-gurobipy.*]
ignore_missing_imports = True
# the facade types against the HiGHS shim; gurobipy's own stubs, if installed, must not change the result
follow_imports = skip
follow_imports_for_stubs = True

# third-party packages without bundled or installed stubs, scoped per package
[mypy-scipy.*]
ignore_missing_imports = True

[mypy-tabulate.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

# >>> generated ratchet - entries may only be removed, never added >>>
[mypy-navigate.output.plot_data]
ignore_errors = True

[mypy-navigate.output.report_writer]
ignore_errors = True

[mypy-navigate.simulation]
ignore_errors = True

