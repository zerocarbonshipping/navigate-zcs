[mypy]
python_version = 3.12
# >>> shared code style (managed block, identical across zerocarbonshipping repositories - do not edit here) >>>
# shared strictness flags; repository-specific settings sit outside this block
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
warn_return_any = True
# <<< shared code style <<<

# untyped third-party solver interfaces
[mypy-gurobipy.*]
ignore_missing_imports = True

[mypy-highspy.*]
ignore_missing_imports = True

# third-party packages without bundled or installed stubs, scoped per package
[mypy-scipy.*]
ignore_missing_imports = True

[mypy-tabulate.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

