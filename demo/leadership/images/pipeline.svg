<!-- How the three tools fit together: a deck goes into Navigate, which writes
     a results file that Lantern draws; Horizon runs Navigate once per future. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470">
  <rect width="1600" height="470" fill="#ffffff"/>

  <defs>
    <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2,1 L10,6 L2,11" fill="none" stroke="#8c8c8c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Horizon, above Navigate: it samples the deck and runs Navigate once per future -->
  <rect x="380" y="34" width="440" height="92" rx="46" fill="#fceec8" stroke="#323232" stroke-width="1.5"/>
  <g fill="none" stroke="#323232" stroke-width="1.5" stroke-linecap="round">
    <path d="M428,80 L478,56"/>
    <path d="M428,80 L478,68"/>
    <path d="M428,80 L478,80"/>
    <path d="M428,80 L478,92"/>
    <path d="M428,80 L478,104"/>
  </g>
  <text x="502" y="76" font-family="Aktiv Grotesk Light" font-size="28" fill="#323232">Horizon</text>
  <text x="502" y="104" font-family="Aktiv Grotesk Light" font-size="17" fill="#585858">runs Navigate across a hundred futures</text>
  <line x1="600" y1="130" x2="600" y2="186" stroke="#8c8c8c" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
  <path d="M594,182 L600,192 L606,182" fill="none" stroke="#8c8c8c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="614" y="164" font-family="Aktiv Grotesk Light" font-size="18" fill="#8c8c8c">×100</text>

  <!-- the stations -->
  <g stroke="#323232" stroke-width="1.5">
    <circle cx="200" cy="260" r="62" fill="#ffffff"/>
    <circle cx="616" cy="276" r="62" fill="#ffffff" stroke="#dcdcdc"/>
    <circle cx="608" cy="268" r="62" fill="#ffffff" stroke="#bebebe"/>
    <circle cx="600" cy="260" r="62" fill="#d4eefa"/>
    <circle cx="1000" cy="260" r="62" fill="#ffffff"/>
    <circle cx="1400" cy="260" r="62" fill="#dcf0d6"/>
  </g>

  <g fill="none" stroke="#8c8c8c" stroke-width="1.4" stroke-linecap="round" marker-end="url(#head)">
    <line x1="282" y1="260" x2="516" y2="260"/>
    <line x1="698" y1="260" x2="916" y2="260"/>
    <line x1="1082" y1="260" x2="1316" y2="260"/>
  </g>

  <g fill="none" stroke="#323232" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- deck: a page of text -->
    <path d="M180,232 L210,232 L222,244 L222,288 L180,288 Z"/>
    <path d="M210,232 L210,244 L222,244"/>
    <line x1="188" y1="254" x2="214" y2="254"/>
    <line x1="188" y1="264" x2="210" y2="264"/>
    <line x1="188" y1="274" x2="214" y2="274"/>
    <!-- Navigate: a ship -->
    <path d="M566,266 L634,266 L626,282 L574,282 Z"/>
    <rect x="574" y="244" width="12" height="22"/>
    <rect x="592" y="254" width="12" height="12"/>
    <rect x="604" y="254" width="12" height="12"/>
    <rect x="598" y="242" width="12" height="12"/>
    <!-- results: a table -->
    <rect x="976" y="238" width="48" height="44" rx="3"/>
    <line x1="976" y1="249" x2="1024" y2="249"/>
    <line x1="976" y1="260" x2="1024" y2="260"/>
    <line x1="976" y1="271" x2="1024" y2="271"/>
    <line x1="992" y1="238" x2="992" y2="282"/>
    <line x1="1008" y1="238" x2="1008" y2="282"/>
    <!-- Lantern: a lantern -->
    <path d="M1390,236 a10,10 0 0 1 20,0"/>
    <path d="M1384,242 L1416,242 L1412,248 L1388,248 Z"/>
    <path d="M1388,248 L1386,280 L1414,280 L1412,248"/>
    <path d="M1382,284 L1418,284"/>
    <path d="M1400,256 c6,7 6,13 0,17 c-6,-4 -6,-10 0,-17 Z" fill="#fae6aa"/>
  </g>

  <!-- names and what each does -->
  <g font-family="Aktiv Grotesk Light" text-anchor="middle">
    <text x="200" y="366" font-size="28" fill="#323232">Deck</text>
    <text x="600" y="366" font-size="28" fill="#323232">Navigate</text>
    <text x="1000" y="366" font-size="28" fill="#323232">Results</text>
    <text x="1400" y="366" font-size="28" fill="#323232">Lantern</text>
    <g font-size="18" fill="#585858">
      <text x="200" y="400">The case in plain text:</text>
      <text x="200" y="424">fleets, fuels, ports, rules</text>
      <text x="600" y="400">Simulates 2026 to 2050: what</text>
      <text x="600" y="424">owners build, buy and burn</text>
      <text x="1000" y="400">Every series of the run</text>
      <text x="1000" y="424">in one Parquet file</text>
      <text x="1400" y="400">Interactive plots</text>
      <text x="1400" y="424">in the browser</text>
    </g>
  </g>
</svg>
