<!-- The demo's banner: the three tools on the left; on the right a ship
     setting out in 2026 into a fan of futures to 2050, the median in bold. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <rect width="1600" height="600" fill="#ffffff"/>

  <!-- the three tools -->
  <text x="88" y="118" font-family="Aktiv Grotesk Light" font-size="18" letter-spacing="4" fill="#8c8c8c">THE CENTER'S OPEN-SOURCE MODELLING TOOLCHAIN</text>

  <text x="82" y="232" font-family="Aktiv Grotesk Hair" font-size="92" fill="#323232">Navigate</text>
  <text x="82" y="336" font-family="Aktiv Grotesk Hair" font-size="92" fill="#323232">Horizon</text>
  <text x="82" y="440" font-family="Aktiv Grotesk Hair" font-size="92" fill="#323232">Lantern</text>

  <circle cx="494" cy="216" r="7" fill="#b8e4f4"/>
  <circle cx="494" cy="320" r="7" fill="#fae6aa"/>
  <circle cx="494" cy="424" r="7" fill="#b8e0c2"/>
  <text x="514" y="224" font-family="Aktiv Grotesk Light" font-size="25" fill="#585858">simulates the world fleet</text>
  <text x="514" y="328" font-family="Aktiv Grotesk Light" font-size="25" fill="#585858">runs it across a hundred futures</text>
  <text x="514" y="432" font-family="Aktiv Grotesk Light" font-size="25" fill="#585858">makes the results visible</text>

  <text x="88" y="540" font-family="Aktiv Grotesk Light" font-size="18" fill="#8c8c8c">Mærsk Mc-Kinney Møller Center for Zero Carbon Shipping</text>

  <!-- the fan of futures: the band between the highest and lowest path, then the paths -->
  <path d="M960,250 C1140,250 1290,205 1520,160 L1520,420 C1290,335 1140,250 960,250 Z" fill="#e8f8fc"/>
  <g fill="none" stroke="#96c8e4" stroke-width="1.3" stroke-linecap="round">
    <path d="M960,250 C1140,250 1290,205 1520,160"/>
    <path d="M960,250 C1140,250 1290,220 1520,190"/>
    <path d="M960,250 C1140,250 1290,232 1520,215"/>
    <path d="M960,250 C1140,250 1290,245 1520,240"/>
    <path d="M960,250 C1140,250 1290,256 1520,262"/>
    <path d="M960,250 C1140,250 1290,266 1520,282"/>
    <path d="M960,250 C1140,250 1290,275 1520,300"/>
    <path d="M960,250 C1140,250 1290,293 1520,336"/>
    <path d="M960,250 C1140,250 1290,302 1520,355"/>
    <path d="M960,250 C1140,250 1290,312 1520,375"/>
    <path d="M960,250 C1140,250 1290,324 1520,398"/>
    <path d="M960,250 C1140,250 1290,335 1520,420"/>
  </g>
  <path d="M960,250 C1140,250 1290,284 1520,318" fill="none" stroke="#3c5e86" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="960" cy="250" r="6" fill="#2c4068"/>
  <text x="960" y="132" font-family="Aktiv Grotesk Light" font-size="16" fill="#8c8c8c">emissions of the world fleet, one line per future</text>

  <!-- the sea and the years -->
  <line x1="900" y1="470" x2="1540" y2="470" stroke="#bebebe" stroke-width="1.4" stroke-linecap="round"/>
  <g fill="none" stroke="#b8e4f4" stroke-width="1.4" stroke-linecap="round">
    <path d="M930,486 q12,-7 24,0 t24,0 t24,0 t24,0 t24,0 t24,0"/>
    <path d="M1010,500 q12,-7 24,0 t24,0 t24,0 t24,0"/>
  </g>
  <text x="960" y="534" font-family="Aktiv Grotesk Light" font-size="17" fill="#8c8c8c" text-anchor="middle">2026</text>
  <text x="1520" y="534" font-family="Aktiv Grotesk Light" font-size="17" fill="#8c8c8c" text-anchor="middle">2050</text>
  <text x="1530" y="164" font-family="Aktiv Grotesk Light" font-size="15" fill="#8c8c8c">more</text>
  <text x="1530" y="424" font-family="Aktiv Grotesk Light" font-size="15" fill="#8c8c8c">less</text>
  <text x="1530" y="322" font-family="Aktiv Grotesk Light" font-size="15" fill="#3c5e86">median</text>

  <!-- the ship, sailing right, sitting on the sea line -->
  <g transform="translate(905,398)" fill="#ffffff" stroke="#323232" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="54" y="22" width="20" height="20"/>
    <rect x="74" y="22" width="20" height="20" fill="#dcf0d6"/>
    <rect x="94" y="22" width="20" height="20"/>
    <rect x="114" y="22" width="20" height="20"/>
    <rect x="134" y="22" width="20" height="20" fill="#fceec8"/>
    <rect x="64" y="4" width="20" height="18"/>
    <rect x="84" y="4" width="20" height="18"/>
    <rect x="104" y="4" width="20" height="18" fill="#d4eefa"/>
    <rect x="18" y="12" width="26" height="30"/>
    <rect x="24" y="0" width="10" height="12"/>
    <path d="M0,42 L196,42 L178,72 L16,72 Z"/>
    <line x1="24" y1="20" x2="38" y2="20"/>
  </g>
</svg>
